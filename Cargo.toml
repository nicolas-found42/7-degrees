[workspace]
resolver = "2"
members = [
    "crates/api-types",
    "crates/app-server",
    "crates/fixture",
    "crates/graph-core",
    "crates/jev-client",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
# Internal crates
api-types = { path = "crates/api-types" }
app-server = { path = "crates/app-server" }
fixture = { path = "crates/fixture" }
graph-core = { path = "crates/graph-core" }
jev-client = { path = "crates/jev-client", default-features = false }

# Server side
axum = "0.8.9"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }
http-body-util = "0.1"

# Domain / shared
petgraph = "0.8.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.11"

# Jev client (verified OpenRouter HTTP transport)
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
http = "1"