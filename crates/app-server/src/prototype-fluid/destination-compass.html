function geometry(){const w=$('stage').clientWidth,h=$('stage').clientHeight,mobile=innerWidth<=600,reserve=variant==='G'&&!mobile?(innerWidth<=950?255:305):variant==='H'&&!mobile?220:0,area=Math.max(180,w-reserve);return{w,h,mobile,area,center:{x:area*.55,y:h*.49},radius:Math.max(50,Math.min(area*.25,h*.30))};}
