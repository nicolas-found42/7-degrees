function renderScene(){if(!ready||root<0)return;const cur=chain.at(-1),visible=new Set([...chain,...eligible]);visible.add(end);for(const [i,el]of elements)if(!visible.has(i)){el.remove();elements.delete(i);positions.delete(i);velocities.delete(i);}targets=targetsForScene();const named=new Set(eligible);for(const i of visible){let el=elements.get(i);if(!el){el=document.createElement('button');el.dataset.player=nodes[i].id;el.tabIndex=0;elements.set(i,el);$('nodes').append(el);wireNode(el,i);positions.set(i,{...targets.get(i)});velocities.set(i,{x:0,y:0});}if(!positions.has(i))positions.set(i,{...targets.get(i)});if(!velocities.has(i))velocities.set(i,{x:0,y:0});const past=chain.includes(i)&&i!==cur,isNext=eligible.includes(i);el.className='node'+(i===cur?(distance<0?' history inactive':' current'):past?' history':i===end&&!isNext?' destination':' candidate')+(named.has(i)?' named':'');el.setAttribute('aria-label',`${i===cur?'Current player':past?'Explore from':isNext?'Extend to':'Reveal destination'} ${nodes[i].name}`);el.title=nodes[i].name;el.replaceChildren();if(i===cur||past){const step=document.createElement('span');step.className='step';step.textContent=variant==='K'&&i===cur?nodes[i].name.split(' ').map(s=>s[0]).slice(0,2).join(''):String(chain.indexOf(i));el.append(step);}else if(i===end&&!isNext)el.append(document.createTextNode('END'));const label=document.createElement('span');label.className='label';label.textContent=nodes[i].name;el.append(label);if(variant==='K'&&!chain.includes(i))el.style.opacity=String(.55+(targets.get(i)?.z||1)*.45);else el.style.opacity='';el.dataset.role=i===cur?'current':past?'history':isNext?'eligible':'destination';if(distance<0&&i===end){el.classList.add('isolated');const note=document.createElement('small');note.textContent=adj[end].length===0?'0 evidenced connections in snapshot':`${adj[end].length} evidenced connections · no route in snapshot`;el.append(note);}}
 const list=[];for(let k=1;k<chain.length;k++){list.push({a:chain[k-1],b:chain[k],kind:'edge-bed'});list.push({a:chain[k-1],b:chain[k],kind:'chain-edge'});}for(const i of eligible)list.push({a:cur,b:i,kind:''});$('edges').replaceChildren();edges=list.map(e=>{const el=document.createElementNS(NS,'path');el.setAttribute('class',e.kind);$('edges').append(el);return{...e,el};});renderEvidence();drawBackground();settle();}
function settle(){until=performance.now()+1500;last=0;if(!motion){positions=new Map([...targets].map(([i,p])=>[i,{...p}]));velocities.clear();until=0;}schedule();}
function schedule(){if(!frame)frame=requestAnimationFrame(paint);}
function paint(now){frame=0;const time=last?Math.min(2,(now-last)/16.67):1;last=now;const cur=chain.at(-1),ids=[...targets.keys()];if(motion&&now<until){for(const i of ids){if(pins.has(i)||drag?.id===i)continue;const p=positions.get(i),t=targets.get(i),v=velocities.get(i)||{x:0,y:0};v.x=(v.x+(t.x-p.x)*.036*time)*.77;v.y=(v.y+(t.y-p.y)*.036*time)*.77;velocities.set(i,v);}for(const i of ids){if(drag?.id===i)continue;if(pins.has(i)){positions.set(i,{...pins.get(i)});continue;}const p=positions.get(i),v=velocities.get(i)||{x:0,y:0};Object.assign(p,clampPoint(i,{x:p.x+v.x*time,y:p.y+v.y*time}));}}

 for(const [i,el]of elements){const p=positions.get(i);el.style.transform=`translate(${p.x}px,${p.y}px)`;}for(const e of edges){const a=positions.get(e.a),b=positions.get(e.b);let d;if(variant==='J'){const delta=(b.x-a.x)*.53;d=`M${a.x},${a.y} C${a.x+delta},${a.y} ${b.x-delta},${b.y} ${b.x},${b.y}`;}else{const dx=b.x-a.x,dy=b.y-a.y,bend=variant==='K'?.17:.11;d=`M${a.x},${a.y} Q${(a.x+b.x)/2-dy*bend},${(a.y+b.y)/2+dx*bend} ${b.x},${b.y}`;}e.el.setAttribute('d',d);e.el.classList.toggle('lit',focus!==null&&(e.a===focus||e.b===focus));}paintLandscape();positionEvidence();if(motion&&now<until)schedule();}
function highlight(i){focus=i;for(const [id,el]of elements)el.classList.toggle('focused',id===i);schedule();}
function wireNode(el,i){el.onpointerdown=e=>{if(e.button!==0)return;e.preventDefault();drag={id:i,x:e.clientX,y:e.clientY,start:{...positions.get(i)},moved:false};el.setPointerCapture(e.pointerId);el.classList.add('dragging');};el.onpointermove=e=>{if(drag?.id!==i)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(dx,dy)>5)drag.moved=true;if(!drag.moved)return;const p=clampPoint(i,{x:drag.start.x+dx,y:drag.start.y+dy});positions.set(i,p);pins.set(i,p);targets.set(i,p);until=performance.now()+250;schedule();};el.onpointerup=e=>{if(drag?.id!==i)return;const moved=drag.moved;drag=null;el.classList.remove('dragging');if(el.hasPointerCapture(e.pointerId))el.releasePointerCapture(e.pointerId);if(moved){dragged++;drawBackground();announce('Placement kept. Dragging does not add a step.');}else if(i===end&&!chain.includes(i)&&!eligible.includes(i))reveal();else extend(i);};el.onpointercancel=()=>{drag=null;el.classList.remove('dragging');};el.onclick=e=>{if(e.detail===0){if(i===end&&!chain.includes(i)&&!eligible.includes(i))reveal();else extend(i);}};el.onmouseenter=()=>highlight(i);el.onmouseleave=()=>highlight(null);}
function mountNext(){const mobile=innerWidth<=600;if(mobile){$('shell').insertBefore($('next-panel'),$('state'));$('query').append($('tools'));}else{if(variant==='J')$('query').insertBefore($('next-panel'),$('discovery'));else $('workspace').append($('next-panel'));$('stage').append($('tools'));}}
function applyVariant(v){variant=v;document.body.dataset.variant=v;mountNext();$('study').textContent=`DIRECTION ${v} / ${concepts[v][0]}`;$('heading').textContent=concepts[v][1];$('description').textContent=concepts[v][2];$('masthead').textContent=concepts[v][0]+' / visual study';$('variant-name').textContent=`${v} · ${concepts[v][0]} (${variants.indexOf(v)+1}/3)`;const u=new URL(location.href);u.searchParams.set('variant',v);history.replaceState(null,'',u);pins.clear();if(ready)requestAnimationFrame(()=>{drawBackground();update();});}
function cycle(d){applyVariant(variants[(variants.indexOf(variant)+d+3)%3]);}
function readPair(){const a=nodes.findIndex(n=>n.name.toLowerCase()===$('from').value.trim().toLowerCase()),b=nodes.findIndex(n=>n.name.toLowerCase()===$('to').value.trim().toLowerCase());if(a<0||b<0){$('feedback').textContent='Choose exact player names from the suggestions.';return;}findPair(a,b);}
$('pair-form').onsubmit=e=>{e.preventDefault();readPair();};$('walk').onclick=()=>{if(distance<0)return;chain=[root];pins.delete(root);$('filter').value='';update('Choose a next teammate. Only shortest continuations are available.');};$('reveal').onclick=reveal;$('undo').onclick=()=>{if(chain.length>1)extend(chain[chain.length-2]);};$('filter').oninput=()=>{renderChoices();announce();};$('release').onclick=()=>{pins.clear();renderScene();announce('Manual placements released.');};$('motion').onclick=()=>{motion=!motion;settle();announce();};$('prev').onclick=()=>cycle(-1);$('next').onclick=()=>cycle(1);addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select,[contenteditable]'))return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();cycle(e.key==='ArrowRight'?1:-1);}if(e.key==='Escape'&&chain.length>1)extend(chain[chain.length-2]);});addEventListener('popstate',()=>{const v=new URLSearchParams(location.search).get('variant');applyVariant(variants.includes(v)?v:'J');});addEventListener('resize',()=>{mountNext();if(ready)renderScene();});new ResizeObserver(()=>{if(ready){mountNext();renderScene();}}).observe($('stage'));
fetch('/api/network').then(r=>r.json()).then(data=>{nodes=data.nodes;links=data.links;nodes.forEach((n,i)=>byId.set(n.id,i));adj=nodes.map(()=>[]);for(const e of data.links){const a=byId.get(e.from),b=byId.get(e.to);adj[a].push(b);adj[b].push(a);relationships.set(edgeKey(a,b),e);teams.set(edgeKey(a,b),[...(e.franchises?.length?e.franchises:[e.team])].sort());}adj=adj.map(a=>[...new Set(a)]);const f=document.createDocumentFragment();[...nodes].sort((a,b)=>a.name.localeCompare(b.name)).forEach(n=>{const o=document.createElement('option');o.value=n.name;f.append(o);});$('players').append(f);ready=true;readPair();applyVariant(variant);startRankings();});applyVariant(variant);
