function size(){const w=$('stage').clientWidth,h=$('stage').clientHeight,mobile=innerWidth<=600;const reserve=variant==='K'&&!mobile?250:variant==='L'&&!mobile?220:0,area=w-reserve;return{w,h,mobile,area,top:variant==='J'&&!mobile?185:variant==='L'&&!mobile?170:mobile?70:175,bottom:variant==='K'&&!mobile?260:mobile?95:170};}
function layoutRibbon(){const {w,h,mobile,area,top,bottom}=size(),height=Math.max(130,h-top-bottom),cy=top+height*.48,cx=area*(chain.length===1?.43:.71),out=new Map();out.set(chain.at(-1),{x:cx,y:cy});const past=chain.slice(0,-1),step=Math.min(area*.23,area*.52/Math.max(1,past.length));past.forEach((i,k)=>{const back=past.length-k;out.set(i,{x:cx-back*step,y:cy+Math.sin(back*1.25)*height*.28});});eligible.forEach((i,k)=>out.set(i,{x:cx+area*(.10+hash(i+'x')*.19),y:top+height*(.10+hash(i+'y')*.82)}));if(distance>=0&&!out.has(end))out.set(end,{x:area*.91,y:top+height*.12});return out;}
function layoutAfterglow(){const {w,h,mobile,area,top,bottom}=size(),height=Math.max(130,h-top-bottom),cy=top+height*.48,cx=area*.56,out=new Map();out.set(chain.at(-1),{x:cx,y:cy});const past=chain.slice(0,-1);past.forEach((i,k)=>{const back=past.length-k,a=2.6+back*.86,r=Math.min(area*.34,height*.48)*(.75+back/Math.max(1,past.length)*.38);out.set(i,{x:cx+Math.cos(a)*r,y:cy+Math.sin(a)*r*.9});});eligible.forEach(i=>{const depth=.25+hash(i+'depth')*.75;out.set(i,{x:cx+(hash(i+'x')-.4)*area*.58,y:top+height*(.05+hash(i+'y')*.9),z:depth});});if(distance>=0&&!out.has(end))out.set(end,{x:area*.86,y:top+height*.22});return out;}
function layoutArchipelago(){const {w,h,mobile,area,top,bottom}=size(),height=Math.max(130,h-top-bottom),cy=top+height*.55,cx=area*.63,out=new Map();out.set(chain.at(-1),{x:cx,y:cy});const past=chain.slice(0,-1);past.forEach((i,k)=>{const f=(k+1)/Math.max(1,chain.length),back=past.length-k;out.set(i,{x:area*(.10+f*.36),y:top+height*(.25+.5*hash(nodes[i].id+'island'))});});const groups=[...new Set(eligible.map(i=>team(chain.at(-1),i)))].sort();eligible.forEach(i=>{const g=groups.indexOf(team(chain.at(-1),i)),a=-1.3+g/Math.max(1,groups.length)*4.8,gx=cx+Math.cos(a)*area*.18,gy=cy+Math.sin(a)*height*.3;out.set(i,{x:gx+(hash(i+'x')-.5)*area*.18,y:gy+(hash(i+'y')-.5)*height*.25});});if(distance>=0&&!out.has(end))out.set(end,{x:area*.88,y:top+height*.14});return out;}
function targetsForScene(){const out=variant==='J'?layoutRibbon():variant==='K'?layoutAfterglow():layoutArchipelago(),{w,h,mobile}=size();for(const [i,p]of out){const wide=chain.includes(i)&&variant!=='K',mx=wide?(mobile?60:78):22;const placed=pins.get(i)||p;const point={x:Math.max(mx,Math.min(w-mx,placed.x)),y:Math.max(mobile?65:variant==='K'?165:190,Math.min(h-(mobile?100:145),placed.y)),z:p.z||1};out.set(i,point);if(pins.has(i))pins.set(i,point);}return out;}

function paintLandscape(){const svg=$('landscape');svg.replaceChildren();if(variant!=='L')return;const groups=new Map(),cur=chain.at(-1);for(const i of eligible){const t=team(cur,i);if(!groups.has(t))groups.set(t,[]);groups.get(t).push(i);}for(let k=1;k<chain.length;k++){const t=team(chain[k-1],chain[k]);if(!groups.has(t))groups.set(t,[]);groups.get(t).push(chain[k-1],chain[k]);}let g=0,labels=[];for(const [name,ids]of groups){const ps=[...new Set(ids)].map(i=>positions.get(i)).filter(Boolean);if(!ps.length)continue;const cx=ps.reduce((s,p)=>s+p.x,0)/ps.length,cy=ps.reduce((s,p)=>s+p.y,0)/ps.length,rx=Math.max(70,...ps.map(p=>Math.abs(p.x-cx)+55)),ry=Math.max(42,...ps.map(p=>Math.abs(p.y-cy)+35)),path=document.createElementNS(NS,'path');let d='';for(let j=0;j<=40;j++){const a=j/40*Math.PI*2,v=1+Math.sin(a*3+g)*.11+Math.cos(a*5+g)*.05;d+=(j?' L':'M')+(cx+Math.cos(a)*rx*v)+','+(cy+Math.sin(a)*ry*v);}path.setAttribute('d',d+'Z');path.setAttribute('fill',['#d2dfc5','#dce4c8','#cbdac7','#e0dec7'][g%4]);path.setAttribute('fill-opacity','.53');path.setAttribute('stroke','#b9c9ac');path.setAttribute('stroke-width','.7');svg.append(path);const text=document.createElementNS(NS,'text');text.setAttribute('x',cx);let ty=Math.max(size().mobile?85:180,cy-ry-12);while(labels.some(p=>Math.abs(p.x-cx)<135&&Math.abs(p.y-ty)<18))ty-=18;labels.push({x:cx,y:ty});text.setAttribute('y',ty);text.setAttribute('text-anchor','middle');text.textContent=name.replace(/_/g,' ');svg.append(text);g++;}}
function renderScene(){if(!ready||root<0)return;const cur=chain.at(-1),visible=new Set([...chain,...eligible]);if(distance>=0)visible.add(end);for(const [i,el]of elements)if(!visible.has(i)){el.remove();elements.delete(i);positions.delete(i);velocities.delete(i);}targets=targetsForScene();const named=new Set(eligible.length<=9?eligible:eligible.filter((_,k)=>k%Math.ceil(eligible.length/7)===0));for(const i of visible){let el=elements.get(i);if(!el){el=document.createElement('button');el.dataset.player=nodes[i].id;el.tabIndex=-1;elements.set(i,el);$('nodes').append(el);wireNode(el,i);positions.set(i,positions.get(cur)?{...positions.get(cur)}:{...targets.get(i)});velocities.set(i,{x:0,y:0});}if(!positions.has(i))positions.set(i,{...targets.get(i)});if(!velocities.has(i))velocities.set(i,{x:0,y:0});const past=chain.includes(i)&&i!==cur,isNext=eligible.includes(i);el.className='node'+(i===cur?' current':past?' history':i===end&&!isNext?' destination':'')+(named.has(i)?' named':'');el.setAttribute('aria-label',`${i===cur?'Current player':past?'Explore from':isNext?'Extend to':'Reveal destination'} ${nodes[i].name}`);el.title=nodes[i].name;el.replaceChildren();if(i===cur||past){const step=document.createElement('span');step.className='step';step.textContent=variant==='K'&&i===cur?nodes[i].name.split(' ').map(s=>s[0]).slice(0,2).join(''):String(chain.indexOf(i));el.append(step);}else if(i===end&&!isNext)el.append(document.createTextNode('END'));const label=document.createElement('span');label.className='label';label.textContent=nodes[i].name;el.append(label);if(variant==='K'&&!chain.includes(i))el.style.opacity=String(.55+(targets.get(i)?.z||1)*.45);else el.style.opacity='';el.dataset.role=i===cur?'current':past?'history':isNext?'eligible':'destination';}
 const list=[];for(let k=1;k<chain.length;k++){list.push({a:chain[k-1],b:chain[k],kind:'edge-bed'});list.push({a:chain[k-1],b:chain[k],kind:'chain-edge'});}for(const i of eligible)list.push({a:cur,b:i,kind:''});$('edges').replaceChildren();edges=list.map(e=>{const el=document.createElementNS(NS,'path');el.setAttribute('class',e.kind);$('edges').append(el);return{...e,el};});settle();}
function settle(){until=performance.now()+1500;last=0;if(!motion){positions=new Map([...targets].map(([i,p])=>[i,{...p}]));velocities.clear();until=0;}schedule();}
function schedule(){if(!frame)frame=requestAnimationFrame(paint);}
function paint(now){frame=0;const time=last?Math.min(2,(now-last)/16.67):1;last=now;const cur=chain.at(-1),ids=[...targets.keys()];if(motion&&now<until){for(const i of ids){if(pins.has(i)||drag?.id===i)continue;const p=positions.get(i),t=targets.get(i),v=velocities.get(i)||{x:0,y:0};v.x=(v.x+(t.x-p.x)*.036*time)*.77;v.y=(v.y+(t.y-p.y)*.036*time)*.77;velocities.set(i,v);}for(let a=0;a<ids.length;a++)for(let b=a+1;b<ids.length;b++){const i=ids[a],j=ids[b],p=positions.get(i),q=positions.get(j),dx=p.x-q.x,dy=p.y-q.y,dd=Math.hypot(dx,dy),wide=variant!=='K'&&(chain.includes(i)||chain.includes(j)),min=wide?105:i===cur||j===cur?63:chain.includes(i)||chain.includes(j)?43:23;if(dd<min){const angle=dd<.01?hash(i+'|'+j)*6.28:Math.atan2(dy,dx),f=(min-dd)*.026*time;for(const [id,sign]of [[i,1],[j,-1]])if(!pins.has(id)&&drag?.id!==id){const v=velocities.get(id)||{x:0,y:0};v.x+=Math.cos(angle)*f*sign;v.y+=Math.sin(angle)*f*sign;velocities.set(id,v);}}}const {w,h,mobile}=size();for(const i of ids){if(drag?.id===i)continue;if(pins.has(i)){positions.set(i,{...pins.get(i)});continue;}const p=positions.get(i),v=velocities.get(i)||{x:0,y:0},wide=variant!=='K'&&chain.includes(i),mx=wide?(mobile?62:78):20;p.x=Math.max(mx,Math.min(w-mx,p.x+v.x*time));p.y=Math.max(mobile?65:variant==='K'?165:190,Math.min(h-(mobile?100:145),p.y+v.y*time));}}
 for(const [i,el]of elements){const p=positions.get(i);el.style.transform=`translate(${p.x}px,${p.y}px)`;}for(const e of edges){const a=positions.get(e.a),b=positions.get(e.b);let d;if(variant==='J'){const delta=(b.x-a.x)*.53;d=`M${a.x},${a.y} C${a.x+delta},${a.y} ${b.x-delta},${b.y} ${b.x},${b.y}`;}else{const dx=b.x-a.x,dy=b.y-a.y,bend=variant==='K'?.17:.11;d=`M${a.x},${a.y} Q${(a.x+b.x)/2-dy*bend},${(a.y+b.y)/2+dx*bend} ${b.x},${b.y}`;}e.el.setAttribute('d',d);e.el.classList.toggle('lit',focus!==null&&(e.a===focus||e.b===focus));}paintLandscape();if(motion&&now<until)schedule();}
function highlight(i){focus=i;for(const [id,el]of elements)el.classList.toggle('focused',id===i);schedule();}
function wireNode(el,i){el.onpointerdown=e=>{if(e.button!==0)return;e.preventDefault();drag={id:i,x:e.clientX,y:e.clientY,start:{...positions.get(i)},moved:false};el.setPointerCapture(e.pointerId);el.classList.add('dragging');};el.onpointermove=e=>{if(drag?.id!==i)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(dx,dy)>5)drag.moved=true;if(!drag.moved)return;const {w,h,mobile}=size(),wide=variant!=='K'&&chain.includes(i),mx=wide?78:22,p={x:Math.max(mx,Math.min(w-mx,drag.start.x+dx)),y:Math.max(65,Math.min(h-100,drag.start.y+dy))};positions.set(i,p);pins.set(i,p);targets.set(i,p);until=performance.now()+250;schedule();};el.onpointerup=e=>{if(drag?.id!==i)return;const moved=drag.moved;drag=null;el.classList.remove('dragging');if(el.hasPointerCapture(e.pointerId))el.releasePointerCapture(e.pointerId);if(moved){dragged++;announce('Placement kept. Dragging does not add a step.');}else if(i===end&&!chain.includes(i)&&!eligible.includes(i))reveal();else extend(i);};el.onpointercancel=()=>{drag=null;el.classList.remove('dragging');};el.onclick=e=>{if(e.detail===0){if(i===end&&!chain.includes(i)&&!eligible.includes(i))reveal();else extend(i);}};el.onmouseenter=()=>highlight(i);el.onmouseleave=()=>highlight(null);}
function mountNext(){if(variant==='J')$('query').append($('next-panel'));else $('workspace').append($('next-panel'));}
function applyVariant(v){variant=v;document.body.dataset.variant=v;mountNext();$('study').textContent=`DIRECTION ${v} / ${concepts[v][0]}`;$('heading').textContent=concepts[v][1];$('description').textContent=concepts[v][2];$('masthead').textContent=concepts[v][0]+' / visual study';$('variant-name').textContent=`${v} · ${concepts[v][0]} (${variants.indexOf(v)+1}/3)`;const u=new URL(location.href);u.searchParams.set('variant',v);history.replaceState(null,'',u);pins.clear();if(ready)requestAnimationFrame(()=>{drawBackground();update();});}
function cycle(d){applyVariant(variants[(variants.indexOf(variant)+d+3)%3]);}
function readPair(){const a=nodes.findIndex(n=>n.name.toLowerCase()===$('from').value.trim().toLowerCase()),b=nodes.findIndex(n=>n.name.toLowerCase()===$('to').value.trim().toLowerCase());if(a<0||b<0){$('feedback').textContent='Choose exact player names from the suggestions.';return;}findPair(a,b);}
$('pair-form').onsubmit=e=>{e.preventDefault();readPair();};$('walk').onclick=()=>{if(distance<0)return;chain=[root];pins.delete(root);$('filter').value='';update('Choose a next teammate. Only shortest continuations are available.');};$('reveal').onclick=reveal;$('undo').onclick=()=>{if(chain.length>1)extend(chain[chain.length-2]);};$('filter').oninput=()=>{renderChoices();announce();};$('release').onclick=()=>{pins.clear();renderScene();announce('Manual placements released.');};$('motion').onclick=()=>{motion=!motion;settle();announce();};$('prev').onclick=()=>cycle(-1);$('next').onclick=()=>cycle(1);addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select,[contenteditable]'))return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();cycle(e.key==='ArrowRight'?1:-1);}if(e.key==='Escape'&&chain.length>1)extend(chain[chain.length-2]);});addEventListener('popstate',()=>{const v=new URLSearchParams(location.search).get('variant');applyVariant(variants.includes(v)?v:'J');});new ResizeObserver(()=>{if(ready){drawBackground();renderScene();}}).observe($('stage'));
fetch('/api/network').then(r=>r.json()).then(data=>{nodes=data.nodes;nodes.forEach((n,i)=>byId.set(n.id,i));adj=nodes.map(()=>[]);for(const e of data.links){const a=byId.get(e.from),b=byId.get(e.to);adj[a].push(b);adj[b].push(a);teams.set(edgeKey(a,b),[...(e.franchises?.length?e.franchises:[e.team])].sort());}adj=adj.map(a=>[...new Set(a)]);const f=document.createDocumentFragment();[...nodes].sort((a,b)=>a.name.localeCompare(b.name)).forEach(n=>{const o=document.createElement('option');o.value=n.name;f.append(o);});$('players').append(f);ready=true;readPair();applyVariant(variant);});applyVariant(variant);
}
